<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPARI HUT RI 81 Registration</title>
<style>
body{margin:0;font-family:Inter,Arial;background:linear-gradient(135deg,#b91c1c,#ef4444,#111827);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:500px;width:100%;background:#ffffff22;backdrop-filter:blur(18px);padding:30px;border-radius:25px;color:white}
.card{background:white;color:#111;padding:25px;border-radius:20px}
h1{text-align:center}
input,select,button{width:100%;padding:14px;margin:8px 0 15px;border-radius:12px;border:1px solid #ddd}
button{background:#b91c1c;color:white;border:0;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>🇮🇩 SPARI HUT RI 81</h1>
<p style="text-align:center">Registrasi Perlombaan AEON People</p>
<div class="card">
<form id="form">
<label>ID AEON</label><input id="id" required>
<label>Nama</label><input id="nama" required>
<label>Divisi</label><input id="divisi" required>
<label>No WhatsApp</label><input id="hp" required>
<label>Lomba</label>
<select id="lomba">
<option>E-Sport PS4 eFootball</option>
<option>Turnamen Futsal</option>
<option>Basket 3x3</option>
<option>Badminton Ganda</option>
<option>Badminton Single</option>
<option>Lomba Nyanyi</option>
<option>Lari 100 Meter Pria</option>
<option>Lari 50 Meter Perempuan</option>
<option>Memindahkan Kertas Ikan</option>
<option>Mindahin Sedotan</option>
<option>Estafet Bola Stik Balon</option>
<option>Balap Karung Pakai Helm</option>
</select>
<button>DAFTAR SEKARANG</button>
</form>
</div>
</div>

<script>
const API="GANTI_DENGAN_URL_APPS_SCRIPT";

document.getElementById("form").onsubmit=async(e)=>{
e.preventDefault();

let kode="SPARI-"+Date.now();

let data={
kode,
id:document.getElementById("id").value,
nama:document.getElementById("nama").value,
divisi:document.getElementById("divisi").value,
hp:document.getElementById("hp").value,
lomba:document.getElementById("lomba").value
};

await fetch(API,{method:"POST",body:JSON.stringify(data)});

alert("Registrasi berhasil\nKode: "+kode);
e.target.reset();
}
</script>
</body>
</html>
