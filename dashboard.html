<!DOCTYPE html>
<html>
<head>
<title>Admin SPARI</title>
<style>
body{font-family:Arial;background:#111827;color:white;padding:20px}
.card{background:#1f2937;padding:20px;border-radius:15px;margin:10px}
button{padding:12px;background:#dc2626;color:white;border:0}
</style>
</head>
<body>
<h1>Dashboard Panitia SPARI</h1>
<div class="card">Total Peserta: <span id="total">0</span></div>
<div class="card">
<table id="table"></table>
</div>
<script>
const API="MASUKKAN_URL_APPS_SCRIPT";
async function load(){
let r=await fetch(API);
let d=await r.json();
total.innerHTML=d.length;
table.innerHTML=d.map(x=>"<tr><td>"+x[2]+"</td><td>"+x[3]+"</td><td>"+x[6]+"</td></tr>").join("");
}
load();
</script>
</body>
</html>
